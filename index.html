<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="もし株">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>もし株</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#17202c; --ink-2:#4f5b6b; --ink-3:#8793a3; --line:#e1e6ec;
  --brand:#1d3a6b; --brand-2:#284c86; --on-brand:#ffffff; --on-brand-2:rgba(255,255,255,.72); --on-brand-line:rgba(255,255,255,.18);
  --on-brand-up:#ffb3bc; --on-brand-down:#a9c8ff;
  --up:#d3233a; --down:#1f63c9; --up-bg:#fce9eb; --down-bg:#e7effb;
  --gold:#b0832a; --ma5:#7b8696; --grid:#e7ebf0;
  --shadow:0 1px 2px rgba(23,32,44,.06),0 4px 14px rgba(23,32,44,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --ink:#e8edf3; --ink-2:#a8b3c2; --ink-3:#748093; --line:#273141;
    --brand:#1f3b6c; --brand-2:#2c5193; --on-brand-up:#ffb3bc; --on-brand-down:#a9c8ff;
    --up:#ff5c6c; --down:#5b9bff; --up-bg:#3a1a20; --down-bg:#16263f; --gold:#d6ab52; --ma5:#9aa5b3; --grid:#222b38;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --ink:#e8edf3; --ink-2:#a8b3c2; --ink-3:#748093; --line:#273141;
  --brand:#1f3b6c; --brand-2:#2c5193; --up:#ff5c6c; --down:#5b9bff; --up-bg:#3a1a20; --down-bg:#16263f; --gold:#d6ab52; --ma5:#9aa5b3; --grid:#222b38;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--ink-2)}

.screen{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(96px + env(safe-area-inset-bottom))}
.screen.with-action{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

/* 上部バー */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:8px}
.appbar h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.back{display:flex;align-items:center;gap:2px;color:var(--brand-2);font-weight:500;height:40px;padding-right:8px}
:root[data-theme="dark"] .back{color:#8fb2ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{color:#8fb2ff}}

/* 資産カード（ホームの主役） */
.hero{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:18px 18px 12px;position:relative;overflow:hidden}
.hero .lbl{font-size:12px;color:var(--on-brand-2)}
.hero .big{font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:2px 0 8px}
.hero .big small{font-size:18px;font-weight:500;margin-left:2px}
.hero .pair{display:flex;gap:22px;flex-wrap:wrap;font-size:13px}
.hero .pair span{color:var(--on-brand-2);display:block;font-size:11px}
.hero .pair b{font-weight:500}
.hero .pos{color:var(--on-brand-up)}.hero .neg{color:var(--on-brand-down)}
.hero canvas{display:block;width:100%;height:140px;margin:12px 0 4px;touch-action:pan-y}
.hero .hov{font-size:12px;color:var(--on-brand-2);min-height:18px}
.hero .seg{display:flex;gap:4px;margin-top:4px}
.hero .seg button{flex:1;font-size:12px;color:var(--on-brand-2);padding:5px 0;border-radius:8px}
.hero .seg button[aria-pressed="true"]{background:var(--on-brand-line);color:var(--on-brand);font-weight:700}
.hero .since{border-top:1px solid var(--on-brand-line);margin-top:10px;padding-top:9px;font-size:12px;color:var(--on-brand-2);display:flex;justify-content:space-between;gap:8px}

/* カード・セクション */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.mt{margin-top:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.sec-h h2{font-size:16px;margin:0;font-weight:700}
.sec-h span,.sec-h button{font-size:12px;color:var(--ink-3)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .card .k{font-size:12px;color:var(--ink-3)}
.split .card .v{font-size:18px;font-weight:700;margin-top:2px}
.split .card .s{font-size:12px}

/* 内訳ドーナツ */
.comp{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.comp svg{width:120px;height:120px;display:block}
.legend{list-style:none;margin:0;padding:0;font-size:13px}
.legend li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pc{color:var(--ink-2)}

/* リスト */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
button.item:active{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{text-align:right;flex:none}
.item .rt .v{font-weight:500}
.item .rt .s{font-size:12px}
.pill{display:inline-block;min-width:68px;text-align:center;font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px;margin-top:2px}
.pill.up{background:var(--up-bg)}.pill.down{background:var(--down-bg)}.pill.flat{background:var(--surface-2)}
.spark{width:64px;height:28px;flex:none}
.emptybox{background:var(--surface);border-radius:16px;padding:22px 18px;text-align:center;color:var(--ink-2);font-size:14px;box-shadow:var(--shadow)}
.emptybox .primary{margin:14px auto 0;max-width:220px}

/* スワイプで削除 */
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .item{border-bottom:0}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--up);color:#fff;font-weight:700;font-size:14px;visibility:hidden}
.swipe.open .swipe-del,.swipe.dragging .swipe-del{visibility:visible}
.swipe-row{position:relative;background:var(--surface);transition:transform .22s ease;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.toast.act{pointer-events:auto}
.toast-act{color:#9dbcff;font-weight:700;margin-left:14px;font-size:13px}
@media (prefers-reduced-motion: reduce){.swipe-row{transition:none}}

/* 検索・並べ替え */
.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;margin-bottom:10px}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}

/* 銘柄詳細 */
.q-head{padding:4px 2px 0}
.q-head .nm{font-size:20px;font-weight:700;line-height:1.3}
.q-head .cd{font-size:12px;color:var(--ink-3)}
.q-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.q-price .p{font-size:34px;font-weight:700;letter-spacing:-.01em}
.q-price .p small{font-size:16px;margin-left:2px;font-weight:500}
.q-price .c{font-size:15px;font-weight:500}
.q-asof{font-size:12px;color:var(--ink-3)}
.chartcard{padding:10px 8px 10px}
.ohlc{font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;padding:0 6px;min-height:20px}
.ohlc b{color:var(--ink);font-weight:500}
#cv{display:block;width:100%;height:260px;touch-action:pan-y}
.ranges{display:flex;gap:4px;padding:6px 4px 0}
.ranges button{flex:1;font-size:12px;color:var(--ink-2);padding:6px 0;border-radius:8px}
.ranges button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:700}
.malegend{display:flex;gap:12px;font-size:11px;color:var(--ink-3);padding:4px 8px 0}
.malegend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.stats div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stats div:nth-last-child(-n+2){border-bottom:0}
.stats span{color:var(--ink-3)}
.stats b{font-weight:500}

/* 下部の売買バー・タブ */
.actionbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:5;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actionbar.notab{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actionbar .in.three{grid-template-columns:1fr 1fr 1.2fr}
.btn-buy,.btn-sell,.btn-next{height:50px;border-radius:14px;color:#fff;font-size:16px;font-weight:700;letter-spacing:.06em}
.btn-buy{background:var(--up)}.btn-sell{background:var(--down)}
.btn-next{background:var(--ink);color:var(--surface)}
.btn-buy:disabled,.btn-sell:disabled{opacity:.35;cursor:not-allowed}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink-3)}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar svg{width:24px;height:24px}

/* ボタン類 */
.primary{display:block;width:100%;height:50px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:16px}
.primary.red{background:var(--up)}.primary.blue{background:var(--down)}
.primary:disabled{opacity:.4}
.ghost{display:block;width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.danger{color:var(--up)}
.textbtn{color:var(--brand-2);font-size:13px;font-weight:500}

/* 口座開設 */
.setup{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 20px 40px}
.setup .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:28px}
.setup .logo img{width:40px;height:40px;border-radius:10px}
.setup h1{font-size:26px;line-height:1.35;margin:0 0 10px}
.setup p{color:var(--ink-2);margin:0 0 24px;font-size:14px}
.field-l{font-size:13px;color:var(--ink-2);margin-bottom:6px;display:block}
.amount{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow)}
.amount input{flex:1;min-width:0;border:0;background:none;font-size:32px;font-weight:700;outline:none;text-align:right}
.amount span{font-size:18px;font-weight:500;color:var(--ink-2)}
.amount:focus-within{border-color:var(--brand-2)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.setup .note{font-size:12px;color:var(--ink-3);margin:0 0 24px}
.err{color:var(--up);font-size:12px;min-height:18px;margin:-4px 0 8px}

/* シート */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(10,14,20,.5)}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line);z-index:1}
.sheet-h h3{margin:0;font-size:17px}
.sheet-b{padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
.ordername{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.ordername b{font-size:16px}
.ordername span{font-size:12px;color:var(--ink-3)}
.qtyrow{display:flex;gap:8px;align-items:center}
.step{width:48px;height:48px;border-radius:12px;background:var(--surface-2);font-size:22px}
.qty{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:20px;font-weight:700}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;font-size:12px;color:var(--ink-3)}
.kv{margin:0 0 16px;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:500}
.sheet-note{font-size:11px;color:var(--ink-3);margin:10px 0 0}
.result-big{font-size:34px;font-weight:700;margin:4px 0 12px}

/* リプレイ */
.rp-top{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.rp-top .d{font-size:20px;font-weight:700}
.rp-top .d small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:8px}
.rp-top .t{text-align:right;font-size:12px;color:var(--ink-3)}
.rp-top .t b{display:block;color:var(--ink);font-size:16px}
.tickbtn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;text-align:left}
.tickbtn .nm{font-weight:700}
.tickbtn .sub{font-size:12px;color:var(--ink-3)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 16px}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);text-align:center;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.state{padding:80px 20px;text-align:center;color:var(--ink-2);font-size:14px}
.foot{font-size:11px;color:var(--ink-3);text-align:center;margin-top:24px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"><div class="state">読み込み中…</div></div>
<dialog id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ================= 設定 ================= */
const REPO = "Shiro-utouto/if-kabu";
const LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
const DATA_BASE = LOCAL ? "data/" : `https://raw.githubusercontent.com/${REPO}/main/data/`;
const KEY = "ifkabu.v2";
const CAL = "1321"; // 営業日カレンダーに使う銘柄
const PRESETS = [100_000, 300_000, 500_000, 1_000_000, 3_000_000, 10_000_000];
const CANDLE_RANGES = [["1か月", 22], ["3か月", 66], ["6か月", 130], ["1年", 250], ["5年", 1300]];
const ASSET_RANGES = [["1週", 5], ["1か月", 22], ["3か月", 66], ["全期間", 0]];
const SEG_COLORS = ["#2c5193", "#d0812e", "#2e8b78", "#8a5bb0", "#c2455a", "#6e8fbf"];

/* ================= 状態 ================= */
const newBook = init => ({ init, cash: init, pos: {}, trades: [], realized: 0 });
const DEFAULT = { acct: null, archive: [], unit: 100, range: 66, assetRange: 0, tab: "home",
                  replay: null, replayCash: 1_000_000, hideDate: true, replayCode: "7203", replayResults: [] };
let S = Object.assign({}, DEFAULT, load() || {});
const ui = { detail: null, scroll: {}, hover: null, assetHover: null, order: null, qty: 100, sort: "code", q: "", setupAmt: 1_000_000 };
let IDX = null;
const DATA = {};

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

/* ================= データ ================= */
const bust = () => "?v=" + Math.floor(Date.now() / 600000);
async function getJSON(name) {
  const r = await fetch(DATA_BASE + name + bust(), { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function getData(code) { if (!DATA[code]) DATA[code] = await getJSON(code + ".json"); return DATA[code]; }
const ensure = codes => Promise.all([...new Set(codes)].map(c => getData(c).catch(() => null)));
const tInfo = code => IDX?.tickers.find(t => t.code === code);
const tName = code => tInfo(code)?.name || DATA[code]?.name || code;
const latestDate = () => IDX.tickers.reduce((m, t) => t.last > m ? t.last : m, "");

/* ================= 計算 ================= */
function upto(rows, date) { let lo = 0, hi = rows.length; while (lo < hi) { const m = (lo + hi) >> 1; if (rows[m][0] <= date) lo = m + 1; else hi = m; } return lo; }
function rowsFor(code, ctx) {
  const d = DATA[code]; if (!d) return [];
  return ctx === "replay" && S.replay ? d.rows.slice(0, upto(d.rows, S.replay.date)) : d.rows;
}
function closeAt(code, date) { const d = DATA[code]; if (!d) return null; const i = upto(d.rows, date); return i ? d.rows[i - 1][4] : null; }
function priceOf(code, ctx) {
  if (ctx === "replay") return closeAt(code, S.replay.date);
  if (DATA[code]) { const r = DATA[code].rows; return r[r.length - 1][4]; }
  return tInfo(code)?.close ?? null;
}
function prevOf(code, ctx) {
  if (ctx === "replay") { const r = rowsFor(code, ctx); return r.length > 1 ? r[r.length - 2][4] : null; }
  if (DATA[code]) { const r = DATA[code].rows; return r.length > 1 ? r[r.length - 2][4] : null; }
  return tInfo(code)?.prev ?? null;
}
function summary(b, ctx) {
  let mv = 0, cost = 0, day = 0;
  for (const [code, p] of Object.entries(b.pos)) {
    const px = priceOf(code, ctx) ?? p.cost / p.qty; const pv = prevOf(code, ctx) ?? px;
    mv += px * p.qty; cost += p.cost; day += (px - pv) * p.qty;
  }
  return { mv, cost, day, total: b.cash + mv, unreal: mv - cost, gain: b.cash + mv - b.init };
}
function ma(rows, n) {
  const out = new Array(rows.length).fill(null); let s = 0;
  for (let i = 0; i < rows.length; i++) { s += rows[i][4]; if (i >= n) s -= rows[i - n][4]; if (i >= n - 1) out[i] = s / n; }
  return out;
}
// 口座開始日から今日までの、日ごとの総資産
function assetSeries(a) {
  const cal = (DATA[CAL]?.rows || []).map(r => r[0]).filter(d => d >= a.startDate);
  if (!cal.length) cal.push(a.startDate);
  const tr = [...a.trades].reverse(); let ti = 0, cash = a.init; const pos = {};
  return cal.map(d => {
    while (ti < tr.length && tr[ti].d <= d) {
      const t = tr[ti++];
      if (t.side === "buy") { cash -= t.p * t.qty; pos[t.code] = (pos[t.code] || 0) + t.qty; }
      else { cash += t.p * t.qty; pos[t.code] = (pos[t.code] || 0) - t.qty; }
    }
    let v = cash;
    for (const [c, q] of Object.entries(pos)) if (q) v += q * (closeAt(c, d) ?? 0);
    return [d, v];
  });
}

const yen = v => Math.round(v).toLocaleString("ja-JP");
const px = v => v == null ? "—" : (Number.isInteger(v) ? v.toLocaleString("ja-JP") : v.toLocaleString("ja-JP", { minimumFractionDigits: 1, maximumFractionDigits: 1 }));
const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "±");
const sYen = v => sgn(Math.round(v)) + yen(Math.abs(v));
const sPx = v => sgn(v) + px(Math.round(Math.abs(v) * 10) / 10);
const pct = v => !isFinite(v) ? "—" : sgn(Math.round(v * 100)) + Math.abs(v).toFixed(2) + "%";
const tone = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const btone = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymd = d => d.replaceAll("-", "/");
const md = d => d.slice(5).replace("-", "/");
const man = v => v >= 10000 && v % 10000 === 0 ? (v / 10000).toLocaleString("ja-JP") + "万円" : yen(v) + "円";
function nowStamp() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function dayLabel(date) {

function toastHost() { const sh = document.getElementById("sheet"); const host = sh.open ? sh : document.body; if (TOAST.parentElement !== host) host.append(TOAST); return TOAST; }
function toast(msg) {
  const t = toastHost(); t.textContent = msg; t.classList.remove("act"); t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function toastUndo(msg, undo) {
  const t = toastHost(); t.textContent = msg;
  const b = document.createElement("button"); b.className = "toast-act"; b.textContent = "元に戻す";
  b.onclick = () => { clearTimeout(toast._t); t.classList.remove("show", "act"); undo(); };
  t.append(b); t.classList.add("show", "act");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show", "act"), 4500);
}

function compHTML(a, s) {

  const total = segs.reduce((t, x) => t + x.v, 0) || 1;
  const R = 46, C = 2 * Math.PI * R; let off = 0;
  const arcs = segs.filter(x => x.v > 0).map(x => {
    const len = x.v / total * C; const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${x.color}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return el;
  }).join("");
  const stockPct = s.mv / total * 100;
  return `<div class="comp">
    <svg viewBox="0 0 120 120" role="img" aria-label="資産の内訳">${arcs}

function spark(arr, chg) {
  if (!arr || arr.length < 2) return `<svg class="spark"></svg>`;
  const lo = Math.min(...arr), hi = Math.max(...arr), w = 64, h = 28, sp = hi - lo || 1;
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * w).toFixed(1)},${(h - 3 - (v - lo) / sp * (h - 6)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${chg >= 0 ? "up" : "down"})" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

/* ================= チャート ================= */
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  return { g, W, H };
}
function niceTicks(lo, hi, count) {
  const raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= raw) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) out.push(Math.round(v * 100) / 100);
  return out;
}

function drawAsset() {
  const cv = document.getElementById("assetCv"); const a = S.acct;
  const all = assetSeries(a); const n = S.assetRange ? Math.min(S.assetRange + 1, all.length) : all.length;
  const ser = all.slice(all.length - n);
  const { g, W, H } = setupCanvas(cv);
  const hov = document.getElementById("assetHov");
  if (ser.length < 2) {
    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(W - 4, H / 2, 4, 0, Math.PI * 2); g.fill();
    hov.textContent = "営業日が進むと、ここに資産の推移が伸びていきます";
    cv._geom = null; return;
  }
  let lo = Math.min(a.init, ...ser.map(x => x[1])), hi = Math.max(a.init, ...ser.map(x => x[1]));
  const sp = (hi - lo) || hi * 0.01 || 1; lo -= sp * 0.12; hi += sp * 0.12;
  const x = i => 4 + i / (ser.length - 1) * (W - 8), y = v => 6 + (hi - v) / (hi - lo) * (H - 12);
  // 元本ライン
  g.strokeStyle = "rgba(255,255,255,.35)"; g.setLineDash([3, 4]); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, y(a.init)); g.lineTo(W, y(a.init)); g.stroke(); g.setLineDash([]);
  g.fillStyle = "rgba(255,255,255,.6)"; g.font = '10px "IBM Plex Sans JP",sans-serif'; g.textAlign = "left";
  const ly = y(a.init); g.textBaseline = ly > 20 ? "bottom" : "top"; g.fillText("はじめの資金", 4, ly > 20 ? ly - 3 : ly + 3);
  // 面
  g.beginPath(); ser.forEach((p, i) => i ? g.lineTo(x(i), y(p[1])) : g.moveTo(x(i), y(p[1])));
  g.lineTo(x(ser.length - 1), H); g.lineTo(x(0), H); g.closePath();
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, "rgba(255,255,255,.22)"); grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fill();
  // 線
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.lineJoin = "round";
  g.beginPath(); ser.forEach((p, i) => i ? g.lineTo(x(i), y(p[1])) : g.moveTo(x(i), y(p[1]))); g.stroke();
  const hi_ = ui.assetHover != null && ui.assetHover < ser.length ? ui.assetHover : ser.length - 1;
  g.fillStyle = "#fff"; g.beginPath(); g.arc(x(hi_), y(ser[hi_][1]), 4, 0, Math.PI * 2); g.fill();
  if (ui.assetHover != null) { g.strokeStyle = "rgba(255,255,255,.5)"; g.beginPath(); g.moveTo(x(hi_), 0); g.lineTo(x(hi_), H); g.stroke(); }
  const d = ser[hi_][1] - a.init;
  hov.innerHTML = `${ymd(ser[hi_][0])}　¥${yen(ser[hi_][1])}　<span class="${btone(d)}">${sYen(d)}</span>`;
  cv._geom = { n: ser.length, x0: 4, w: W - 8 };
}

function drawCandles(code, ctx) {
  const cv = document.getElementById("cv");
  const all = rowsFor(code, ctx);
  const n = Math.min(S.range, all.length), start = all.length - n;
  const rows = all.slice(start), m5 = ma(all, 5).slice(start), m25 = ma(all, 25).slice(start);
  const { g, W, H } = setupCanvas(cv);
  if (!rows.length) { cv._geom = null; return; }
  const padR = 50, priceH = H - 70, volTop = priceH + 12, volH = H - volTop - 18, cw = W - padR - 4;
  let lo = Infinity, hi = -Infinity, vmax = 0;
  rows.forEach((r, i) => { lo = Math.min(lo, r[3]); hi = Math.max(hi, r[2]); vmax = Math.max(vmax, r[5]);
    [m5[i], m25[i]].forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
  const sp = (hi - lo) || hi * 0.02 || 1; lo -= sp * 0.06; hi += sp * 0.06;
  const y = v => 6 + (hi - v) / (hi - lo) * (priceH - 6);
  const step = cw / n, bw = Math.max(1, Math.min(9, step * 0.66)), x = i => 4 + step * (i + 0.5);
  const UP = css("--up"), DN = css("--down"), INK = css("--ink"), FAINT = css("--ink-3"), GRID = css("--grid");

  g.font = '11px "IBM Plex Sans JP",sans-serif'; g.textBaseline = "middle"; g.textAlign = "left";
  niceTicks(lo, hi, 4).forEach(t => { const yy = Math.round(y(t)) + 0.5;
    g.strokeStyle = GRID; g.lineWidth = 1; g.beginPath(); g.moveTo(0, yy); g.lineTo(cw + 4, yy); g.stroke();
    g.fillStyle = FAINT; g.fillText(t.toLocaleString("ja-JP"), cw + 8, yy); });

  rows.forEach((r, i) => { const h = vmax ? r[5] / vmax * volH : 0; g.fillStyle = r[4] >= r[1] ? UP : DN; g.globalAlpha = 0.3; g.fillRect(x(i) - bw / 2, volTop + volH - h, bw, h); });
  g.globalAlpha = 1;
  rows.forEach((r, i) => { const [, o, h, l, c] = r, col = c >= o ? UP : DN, xx = Math.round(x(i)) + 0.5;
    g.strokeStyle = col; g.lineWidth = 1; g.beginPath(); g.moveTo(xx, y(h)); g.lineTo(xx, y(l)); g.stroke();
    g.fillStyle = col; g.fillRect(xx - bw / 2, y(Math.max(o, c)), bw, Math.max(1, Math.abs(y(o) - y(c)))); });
  [[m5, css("--ma5")], [m25, css("--gold")]].forEach(([arr, col]) => { g.strokeStyle = col; g.lineWidth = 1.4; g.beginPath(); let on = false;
    arr.forEach((v, i) => { if (v == null) { on = false; return; } on ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)); on = true; }); g.stroke(); });

  if (!(ctx === "replay" && S.hideDate)) {
    g.fillStyle = FAINT; g.textAlign = "center"; g.textBaseline = "alphabetic"; const every = Math.max(1, Math.ceil(n / 4));
    for (let i = n - 1; i >= 0; i -= every) { const d = rows[i][0]; g.fillText(n > 260 ? d.slice(0, 7).replace("-", "/") : md(d), Math.min(Math.max(x(i), 20), cw - 16), H - 3); }
  }
  const hi_ = ui.hover != null && ui.hover < n ? ui.hover : null;
  if (hi_ != null) { const xx = Math.round(x(hi_)) + 0.5; g.strokeStyle = INK; g.globalAlpha = 0.45; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(xx, 0); g.lineTo(xx, H - 16); g.stroke(); g.setLineDash([]); g.globalAlpha = 1; }
  const r = rows[hi_ ?? n - 1];
  document.getElementById("ohlc").innerHTML = `<span>${dayLabel(r[0])}</span><span>始 <b>${px(r[1])}</b></span><span>高 <b>${px(r[2])}</b></span><span>安 <b>${px(r[3])}</b></span><span>終 <b>${px(r[4])}</b></span>`;
  cv._geom = { n, x0: 4, w: cw, step };
}

    <p class="sheet-note">${ctx === "replay" ? "表示中の日の終値で約定します（練習用）。" : "最新の終値ですぐに約定します。実際の注文は出ません。手数料はかかりません。"}</p>
  </div>`;
}
function placeOrder() {
  const { side, ctx, code } = ui.order; const b = ctx === "replay" ? S.replay : S.acct;
  const rows = rowsFor(code, ctx), last = rows[rows.length - 1], p = last[4], n = ui.qty;
  const pos = b.pos[code] || { qty: 0, cost: 0 };
  const rec = { d: last[0], code, side, qty: n, p };
  if (ctx === "replay") rec.day = S.replay.day; else rec.at = nowStamp();
  if (side === "buy") {
    if (p * n > b.cash + 1e-6) return;
    b.cash -= p * n; pos.qty += n; pos.cost += p * n; b.pos[code] = pos;
  } else {
    if (pos.qty < n) return;
    const avg = pos.cost / pos.qty, pl = (p - avg) * n;
    b.cash += p * n; b.realized += pl; pos.qty -= n; pos.cost -= avg * n; rec.pl = pl;
    if (pos.qty <= 0) delete b.pos[code]; else b.pos[code] = pos;
  }
  b.trades.unshift(rec); if (b.trades.length > 2000) b.trades.length = 2000;
  save(); document.getElementById("sheet").close();
  toast(`約定しました：${tName(code)} ${n.toLocaleString()}株 ${side === "buy" ? "買い" : "売り"}${rec.pl != null ? "（" + sYen(rec.pl) + "円）" : ""}`);
  render();
}

const OPEN_X = -88, FULL_X = -150;
let sw = null;
function closeSwipe(el) { el.classList.remove("open"); el.querySelector(".swipe-row").style.transform = ""; }
document.addEventListener("pointerdown", e => {
  const opened = document.querySelector(".swipe.open");
  const row = e.target.closest(".swipe-row");
  if (opened && !e.target.closest(".swipe-del") && (!row || row.parentElement !== opened)) closeSwipe(opened);
  if (!row) return;

    else if (Math.abs(dy) > 8) { sw = null; return; }
    else return;
  }

  sw.row.style.transform = `translateX(${sw.t}px)`;
});

  const box = s.row.parentElement; setTimeout(() => box.classList.remove("dragging"), 250);
  if (!s.drag) { if (s.base < 0) closeSwipe(box); return; }
  if (s.t <= FULL_X) { s.row.style.transform = "translateX(-100%)"; const [k, i] = box.querySelector(".swipe-del").dataset.del.split(":"); setTimeout(() => deleteRecord(k, +i), 180); }
  else if (s.t < OPEN_X / 2) { box.classList.add("open"); s.row.style.transform = `translateX(${OPEN_X}px)`; }
  else closeSwipe(box);
}
document.addEventListener("pointerup", endSwipe);
document.addEventListener("pointercancel", endSwipe);

/* ================= ナビゲーション ================= */
async function openDetail(code) {
  ui.scroll[S.tab] = window.scrollY; await ensure([code]); ui.detail = code; ui.hover = null; render(); window.scrollTo(0, 0);
}
function goTab(tab) {
  ui.detail = null; ui.hover = null; ui.assetHover = null; S.tab = tab; save(); render(); window.scrollTo(0, ui.scroll[tab] || 0);
}

/* ================= イベント ================= */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const ds = t.dataset, act = ds.act;
  if (ds.del) { const [k, i] = ds.del.split(":"); return deleteRecord(k, +i); }
  if (ds.tab) return goTab(ds.tab);
  if (ds.open) { if (document.getElementById("sheet").open) document.getElementById("sheet").close(); return openDetail(ds.open); }
  if (ds.preset) { ui.setupAmt = +ds.preset; return render(); }
  if (ds.arange != null) { S.assetRange = +ds.arange; ui.assetHover = null; save(); return render(); }
  if (ds.range) { S.range = +ds.range; ui.hover = null; save(); return render(); }
  if (ds.sort) { ui.sort = ds.sort; return render(); }
  if (ds.order) return openOrder(ds.order, ui.detail ? "real" : "replay", ui.detail || S.replayCode);
  if (ds.ostep) { ui.qty = Math.max(S.unit, ui.qty + (+ds.ostep) * S.unit); return renderOrder(); }
  if (ds.ofill) { ui.qty = Math.max(S.unit, +ds.ofill); return renderOrder(); }
  if (ds.rcash) { S.replayCash = +ds.rcash; save(); return render(); }
  if (ds.adv) return replayAdvance(+ds.adv);
  if (ds.rpick) { document.getElementById("sheet").close(); S.replayCode = ds.rpick; ui.hover = null; save(); await ensure([ds.rpick]); render(); return; }
  switch (act) {
    case "open": {
      const v = parseInt(document.getElementById("amt").value.replace(/[^\d]/g, ""), 10);
      if (!(v >= 10_000 && v <= 1_000_000_000)) { document.getElementById("amtErr").textContent = "1万円〜10億円の範囲で入力してください。"; return; }
      S.acct = Object.assign(newBook(v), { startedAt: nowStamp(), startDate: latestDate() });
      S.tab = "home"; save(); render(); toast(`${man(v)}で口座をつくりました`); return;
    }
    case "back": ui.detail = null; ui.hover = null; render(); window.scrollTo(0, ui.scroll[S.tab] || 0); return;
    case "settings": return settingsSheet();
    case "close": return document.getElementById("sheet").close();
    case "unit":
      S.unit = S.unit === 100 ? 1 : 100; ui.qty = S.unit; save();
      return ui.order && document.getElementById("sheet").open && document.querySelector("#sheet [data-act=place]") ? renderOrder() : settingsSheet();
    case "place": return placeOrder();
    case "restart": return restartConfirm();
    case "restartok": {
      const a = S.acct, s = summary(a, "real");
      S.archive.unshift({ init: a.init, startedAt: a.startedAt, endedAt: nowStamp(), final: s.total, trades: a.trades.length });
      S.acct = null; ui.setupAmt = a.init; save(); document.getElementById("sheet").close(); render(); return;
    }
    case "rstart": return replayStart();
    case "rend": return replayEnd();
    case "rpicker": return pickerSheet();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === "amt") {
    const v = parseInt(e.target.value.replace(/[^\d]/g, ""), 10) || 0; ui.setupAmt = v;
    e.target.value = v ? yen(v) : ""; document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.preset === v));
    document.getElementById("amtErr").textContent = "";
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "oq") { ui.qty = Math.max(S.unit, Math.round((+e.target.value || S.unit) / S.unit) * S.unit); renderOrder(); }
  if (e.target.id === "hideDate") { S.hideDate = e.target.checked; save(); }
});
document.getElementById("sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.close(); });
document.getElementById("sheet").addEventListener("close", () => { ui.order = null; });

// チャートのなぞり
function hoverAt(e) {
  const cv = e.target; if (!cv._geom) return;
  const rect = cv.getBoundingClientRect(), rx = e.clientX - rect.left - cv._geom.x0;
  if (cv.id === "cv") { const i = Math.max(0, Math.min(cv._geom.n - 1, Math.floor(rx / cv._geom.step))); if (i !== ui.hover) { ui.hover = i; drawCandles(ui.detail || S.replayCode, ui.detail ? "real" : "replay"); } }
  else { const i = Math.max(0, Math.min(cv._geom.n - 1, Math.round(rx / cv._geom.w * (cv._geom.n - 1)))); if (i !== ui.assetHover) { ui.assetHover = i; drawAsset(); } }
}
["pointerdown", "pointermove"].forEach(ev => document.addEventListener(ev, e => { if (e.target.id === "cv" || e.target.id === "assetCv") hoverAt(e); }));
document.addEventListener("pointerleave", e => {
  if (e.target.id === "cv") { ui.hover = null; drawCandles(ui.detail || S.replayCode, ui.detail ? "real" : "replay"); }
  if (e.target.id === "assetCv") { ui.assetHover = null; drawAsset(); }
}, true);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);

/* ================= 起動 ================= */
async function boot() {
  try { IDX = await getJSON("index.json"); }
  catch { app.innerHTML = `<div class="state">株価データを読み込めませんでした。<br>通信状態を確認して、もう一度開いてください。<br><br><button class="primary" style="max-width:220px;margin:0 auto" onclick="location.reload()">再読み込み</button></div>`; return; }
  if (!tInfo(S.replayCode)) S.replayCode = IDX.tickers[0].code;
  const need = [CAL, ...(S.acct ? Object.keys(S.acct.pos) : []), ...(S.acct ? S.acct.trades.map(t => t.code) : []),
                ...(S.replay ? [S.replayCode, ...Object.keys(S.replay.pos)] : [])];
  await ensure(need);
  render();
}
boot();
})();
</script>
